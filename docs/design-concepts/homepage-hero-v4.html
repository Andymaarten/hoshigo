<!-- v4: the restrained addition — existing hero left untouched, a quarter-turned strict-but-offset stamp grid added directly below it as a wide horizontal band with a hairline editorial frame. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hoshigo — hero concept v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --ground:#efe7d8; --ink:#1d1c1a; --muted:#5b574f; --accent:#d8321f;
  --accent-deep:#93210f; --rule:rgba(29,28,26,.22);
  --display:"Schibsted Grotesk",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.page{max-width:1200px;margin:0 auto;padding:24px 24px 64px}

.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.word{font-family:var(--serif);font-size:56px;line-height:1}
.tittle{position:relative;display:inline-block}
.tittle::after{content:"";position:absolute;left:50%;top:.03em;width:.15em;height:.15em;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.gloss{margin-top:8px;font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.gloss .ja{font-family:var(--serif);color:var(--ink);font-size:18px}
hr.rule{width:180px;margin:14px 0 12px;border:0;border-top:1.5px solid var(--ink)}
.def{font-family:var(--serif);font-size:19px;line-height:1.35;max-width:60ch}
.menu{display:flex;gap:14px;font-size:15px;font-weight:700;padding-top:8px}
.menu a{text-decoration:none}

/* --- the band --- */
.band{margin-top:44px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);padding:18px 0 22px}
.band-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.prompt{margin:0;font-size:18px;font-weight:700}
.kicker{font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* Quarter turn: the reference's tall column count becomes the row count.
   Strict columns, alternating row offset — a grid that breathes rather than marches. */
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:26px 18px;justify-items:center}
.cell{display:flex;align-items:center;justify-content:center}
.grid .cell:nth-child(5n+2),.grid .cell:nth-child(5n+4){transform:translateY(16px)}
.dot{display:block;border-radius:50%;text-decoration:none;transition:transform .16s cubic-bezier(.2,.7,.3,1)}
.disc{display:block;width:100%;height:100%;border-radius:50%;background:var(--accent);
  box-shadow:0 7px 0 0 var(--accent-deep),0 9px 0 2px rgba(29,28,26,.10),0 16px 20px -8px rgba(29,28,26,.32);
  transition:box-shadow .16s ease,background .16s ease}
.dot:hover{transform:translateY(4px)}
.dot:hover .disc,.dot:focus-visible .disc{background:#e23a25;box-shadow:0 3px 0 0 var(--accent-deep),0 4px 0 2px rgba(29,28,26,.10),0 8px 12px -8px rgba(29,28,26,.32)}
.dot:active{transform:translateY(7px)}
.dot:active .disc{box-shadow:0 1px 0 0 var(--accent-deep),0 2px 0 2px rgba(29,28,26,.10)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .page{padding:20px 16px 48px}
  .word{font-size:38px}
  .def{font-size:17px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px 12px}
  .grid .cell{transform:none!important}
  .grid .cell:nth-child(3n+2){transform:translateY(12px)!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <div class="word">hosh<span class="tittle">ı</span>go</div>
      <div class="gloss"><span class="ja" lang="ja">星五</span><span>[ho.ɕi.ɡo]</span><i>noun</i></div>
      <hr class="rule" />
      <p class="def"><i>Japanese.</i> five stars. A place where you can curate everything that you give five stars. Nobody’s selling your attention here — see <a href="#" style="text-decoration:underline">what we’re about</a>.</p>
    </div>
    <nav class="menu"><a href="#"><span>about</span></a><a href="#"><span>sign in</span></a><a href="#"><span>join</span></a></nav>
  </header>

  <section class="band">
    <div class="band-head">
      <p class="prompt">Press one of the hoshigo’s below for a preview.</p>
      <span class="kicker">星五 · ten samples</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const sizes = [76,58,88,64,80, 62,86,70,92,56];
document.getElementById('grid').innerHTML = sizes.map(s=>
  `<div class="cell"><a class="dot" href="/testuser" style="width:${s}px;height:${s}px">
     <span class="disc"></span><span class="sr">Preview a hoshigo profile</span></a></div>`).join('');
</script>
</body>
</html>
