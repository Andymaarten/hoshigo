<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Newsreader:wght@400;700&display=swap");
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#efe7d8;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#efe7d8;">
      <tr>
        <td align="center" style="padding:48px 24px;">
          <table role="presentation" width="100%" style="max-width:480px;" cellpadding="0" cellspacing="0">
            <tr>
              <td style="font-family:'Newsreader',Georgia,'Times New Roman',serif; font-size:36px; color:#1d1c1a; padding-bottom:32px;">
                hosh<span style="position:relative; display:inline-block;"
                  >i<span
                    style="position:absolute; top:-3px; left:6px; width:5px; height:5px; border-radius:50%; background-color:#d8321f; display:inline-block;"
                  ></span></span
                >go
              </td>
            </tr>
            <tr>
              <td style="font-family:Helvetica,Arial,sans-serif; font-size:22px; font-weight:700; color:#1d1c1a; padding-bottom:16px;">
                Your login link
              </td>
            </tr>
            <tr>
              <td style="font-family:'Newsreader',Georgia,'Times New Roman',serif; font-size:16px; line-height:1.5; color:#5b574f; padding-bottom:28px;">
                Press the button below to sign in to hoshigo. This link works once and expires shortly.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom:28px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; padding:14px 28px; background-color:#d8321f; color:#efe7d8; font-family:Helvetica,Arial,sans-serif; font-size:16px; font-weight:700; text-decoration:none;"
                  >Log in to hoshigo</a
                >
              </td>
            </tr>
            <tr>
              <td style="font-family:Helvetica,Arial,sans-serif; font-size:13px; line-height:1.5; color:#5b574f; border-top:1px solid rgba(29,28,26,0.22); padding-top:20px;">
                Didn&rsquo;t request this? You can ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
